<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARDS 网页版 - 二战卡牌游戏</title>
<link rel="stylesheet" href="css/kards.css?v=49">
<link rel="preload" href="data/cards.json" as="fetch" crossorigin>
</head>
<body>

<!-- ============ START SCREEN（对齐官方主菜单：顶栏 + 左栏导航 + 中央横幅/组卡区 + 右栏 + 底栏） ============ -->
<div id="start-screen" class="screen">
  <div class="start-bg"></div>
  <div class="home-wrap">
    <!-- 顶栏：徽记 + 标题 + 载入状态 / 卡牌数 -->
    <div class="home-topbar">
      <div class="ht-left">
        <div class="ht-logo">✪</div>
        <div class="ht-title">KARDS<span>二战卡牌游戏 · 网页版</span></div>
        <div id="boot-status" class="boot-status">正在载入卡牌数据…</div>
      </div>
      <div class="ht-right" id="card-count-label"></div>
    </div>

    <div class="home-main">
      <!-- 左栏导航（官方：开始 / 卡牌 / 商店） -->
      <div class="home-nav">
        <button class="nav-item primary" id="btn-vs-ai"><span class="ni-ico">▶</span><span class="ni-txt">开始<b>对战</b></span></button>
        <button class="nav-item" id="btn-collection"><span class="ni-ico">🃏</span><span class="ni-txt">卡牌<b>收藏</b></span></button>
        <button class="nav-item" id="btn-preset-deck"><span class="ni-ico">✦</span><span class="ni-txt">社区<b>卡组</b></span></button>
      </div>

      <!-- 中央：横幅（扇形国家卡艺术）+ 组卡区 -->
      <div class="home-center">
        <div class="home-banner">
          <div class="hb-cards" aria-hidden="true">
            <i class="hbc c1" title="TIGER I-H"></i><i class="hbc c2" title="KV-1 1939"></i><i class="hbc c3" title="SPITFIRE Mk II"></i><i class="hbc c4" title="101st AIRBORNE"></i><i class="hbc c5" title="A6M2 ZERO"></i>
          </div>
          <div class="hb-text">
            <b>组建你的军团</b>
            <span>选择国家与总部，部署支援阵线，夺取前线，摧毁敌方总部！</span>
          </div>
          <div class="hb-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
        </div>
        <div class="home-setup">
          <div class="setup-block">
            <div class="setup-label">选择国家</div>
            <div id="nation-grid" class="nation-grid"></div>
          </div>
          <div class="setup-block cols">
            <div class="setup-col">
              <div class="setup-label">总部</div>
              <select id="hq-select" class="code-input"></select>
            </div>
            <div class="setup-col">
              <div class="setup-label">副国</div>
              <select id="ally-select" class="code-input"></select>
            </div>
            <div class="setup-col deckname-col">
              <div class="setup-label">当前卡组</div>
              <div id="deck-name-label" class="deck-name-label">自动卡组</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右栏（官方：Bilibili / 竞技场 / 打开卡包） -->
      <div class="home-side">
        <button class="side-item" id="btn-build-deck"><span class="si-ico">🛠</span><span class="si-txt">卡组<b>构筑</b></span></button>
        <button class="side-item" id="btn-auto-deck"><span class="si-ico">⚡</span><span class="si-txt">自动<b>卡组</b></span></button>
        <button class="side-item" id="btn-create-room"><span class="si-ico">🏠</span><span class="si-txt">创建<b>房间</b></span></button>
        <button class="side-item" id="btn-join-room"><span class="si-ico">🔑</span><span class="si-txt">加入<b>房间</b></span></button>
      </div>
    </div>

    <!-- 底栏（官方：军需箱 / 任务 + 状态区） -->
    <div class="home-bottombar">
      <div class="hbb-slot" id="lan-info"></div>
      <div class="hbb-foot">
        <span>玩家自制网页致敬版 · 与 1939 Games 官方无关</span>
        <b class="build-tag">构建 v49</b>
      </div>
    </div>
  </div>
</div>

<!-- ============ PRESET DECKS MODAL ============ -->
<div id="preset-modal" class="modal hidden">
  <div class="modal-box preset-box">
    <div class="modal-title">社区卡组</div>
    <div id="preset-list" class="preset-list"></div>
    <button class="btn btn-close" id="preset-close">关闭</button>
  </div>
</div>

<!-- ============ JOIN ROOM MODAL ============ -->
<div id="join-modal" class="modal hidden">
  <div class="modal-box join-box">
    <div class="modal-title">加入房间</div>
    <div class="join-desc">请输入主机屏幕上显示的 4 位房间码。</div>
    <input id="join-code-input" class="code-input" maxlength="4" placeholder="房间码" autocomplete="off">
    <div class="join-actions">
      <button class="btn btn-primary" id="join-confirm">加入</button>
      <button class="btn btn-close" id="join-close">取消</button>
    </div>
  </div>
</div>

<!-- ============ ROOM LOBBY ============ -->
<div id="lobby-screen" class="screen hidden">
  <div class="lobby-panel">
    <div class="lobby-title">局域网房间</div>
    <div class="room-code" id="room-code-display">----</div>
    <div class="lobby-desc">邀请对手在同一局域网下打开以下地址，并输入房间码：</div>
    <div class="lobby-url" id="lobby-url"></div>
    <div class="lobby-status" id="lobby-status">等待对手加入…</div>
    <div class="lobby-actions">
      <button class="btn btn-close" id="lobby-leave">离开房间</button>
    </div>
  </div>
</div>

<!-- ============ GAME SCREEN (1280x720 design canvas, auto scaled) ============ -->
<div id="game-screen" class="screen hidden">
  <div id="table">

    <!-- 桌面 -->
    <div class="table-wood"></div>
    <div class="table-props"></div>
    <div class="table-vignette"></div>

    <!-- 对手手牌（顶部，被屏幕裁切） -->
    <div class="hand opp-hand" id="opp-hand"></div>

    <!-- 对手信息 -->
    <div class="ppanel" id="opp-panel">
      <div class="avatar" id="opp-avatar"></div>
      <div class="ppanel-name" id="opp-name">对手</div>
      <div class="kredit" id="opp-kredit"><b class="kb-cur">0</b><span class="kb-k">K</span><span class="kb-slots">1</span></div>
    </div>
    <!-- 对手牌库堆（官方：左上角头像压在牌堆上） -->
    <div class="deck-stack opp" aria-hidden="true"></div>

    <!-- 对手支援阵线 -->
    <div class="support-line" id="line-opp">
      <div class="slot" data-drop="support" data-side="opp" data-slot="0"></div>
      <div class="slot" data-drop="support" data-side="opp" data-slot="1"></div>
      <div class="hq-slot" id="opp-hq-slot" data-drop="hq"></div>
      <div class="slot" data-drop="support" data-side="opp" data-slot="2"></div>
      <div class="slot" data-drop="support" data-side="opp" data-slot="3"></div>
    </div>

    <!-- 前线 -->
    <div class="frontline" id="frontline">
      <div class="fl-dashes" id="fl-dashes"></div>
      <div class="row-frontline" id="row-frontline" data-drop="front"></div>
      <div class="fl-tag" id="fl-tag">前线</div>
    </div>

    <!-- 己方支援阵线 -->
    <div class="support-line" id="line-own">
      <div class="slot" data-drop="support" data-side="own" data-slot="0"></div>
      <div class="slot" data-drop="support" data-side="own" data-slot="1"></div>
      <div class="hq-slot" id="own-hq-slot"></div>
      <div class="slot" data-drop="support" data-side="own" data-slot="2"></div>
      <div class="slot" data-drop="support" data-side="own" data-slot="3"></div>
    </div>

    <!-- 己方手牌（底部，扇形） -->
    <div class="hand own-hand" id="own-hand"></div>

    <!-- 己方信息 -->
    <div class="ppanel" id="own-panel">
      <div class="avatar" id="own-avatar"></div>
      <div class="ppanel-name" id="own-name">你</div>
      <div class="kredit" id="own-kredit"><b class="kb-cur">0</b><span class="kb-k">K</span><span class="kb-slots">1</span></div>
    </div>
    <!-- 己方牌库堆（官方：右下角） -->
    <div class="deck-stack own" aria-hidden="true"></div>

    <!-- 按钮 -->
    <button class="game-btn thin" id="btn-enemy">敌方</button>
    <button class="game-btn end" id="btn-end-turn">结束回合</button>
    <button class="icon-btn" id="btn-chat" title="对局记录">💬</button>

    <!-- 覆盖层 -->
    <div id="fx-layer" class="fx-layer"></div>
    <div id="turn-banner" class="turn-banner hidden"></div>
    <div id="log-panel" class="log-panel"></div>
    <div id="target-hint" class="target-hint hidden">选择目标</div>

    <!-- 二选一（Choose one） -->
    <div id="choose-modal" class="modal hidden">
      <div class="modal-box choose-box">
        <div class="choose-title">选择一项</div>
        <div class="choose-sub" id="choose-sub">这张卡有两种效果，选择其中一个结算</div>
        <div class="choose-options" id="choose-options"></div>
      </div>
    </div>

    <div id="gameover-modal" class="modal hidden">
      <div class="modal-box gameover-box">
        <div class="gameover-flower" id="gameover-flower" aria-hidden="true"></div>
        <div class="gameover-title" id="gameover-title">胜利</div>
        <div class="gameover-sub" id="gameover-sub"></div>
        <div class="gameover-actions">
          <button class="btn btn-primary" id="btn-rematch">再来一局</button>
          <button class="btn btn-close" id="btn-gameover-menu">返回主菜单</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ COLLECTION BROWSER ============ -->
<div id="collection-modal" class="modal hidden">
  <div class="modal-box collection-box">
    <div class="modal-title">卡牌收藏 <span id="collection-count" style="font-size:12px;color:var(--text-dim)"></span></div>
    <div class="collection-filters">
      <input id="collection-search" class="code-input" style="font-size:13px;letter-spacing:0.03em;text-align:left;padding:8px 10px;margin-bottom:0" placeholder="搜索卡牌名称或效果文本…">
      <select id="collection-nation" class="collection-select"></select>
      <select id="collection-type" class="collection-select">
        <option value="">全部类型</option>
        <option value="infantry">步兵</option>
        <option value="tank">坦克</option>
        <option value="artillery">火炮</option>
        <option value="fighter">战斗机</option>
        <option value="bomber">轰炸机</option>
        <option value="order">指令</option>
        <option value="gotcha">反制</option>
        <option value="location">地点</option>
      </select>
    </div>
    <div id="collection-grid" class="collection-grid"></div>
    <button class="btn btn-close" id="collection-close" style="margin-top:12px;width:100%">关闭</button>
  </div>
</div>

<!-- card detail popup -->
<div id="card-popup" class="card-popup hidden"></div>

<script src="js/vendor/gsap.min.js?v=49"></script>
<script src="js/engine.js?v=51"></script>
<script src="js/ai.js?v=49"></script>
<script src="js/net.js?v=49"></script>
<script src="js/sfx.js?v=49"></script>
<script src="js/ui.js?v=49"></script>
<script src="js/main.js?v=49"></script>
</body>
</html>
